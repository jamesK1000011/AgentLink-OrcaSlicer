<!-- Agent Link for OrcaSlicer: a nozzle laying the last layer of a part, a
     link between the two. Original artwork; mcpb/icon.png is rendered from it
     (rsvg-convert -w 512 -h 512 mcpb/icon.svg -o mcpb/icon.png). -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b4d"/>
      <stop offset="1" stop-color="#12232e"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <!-- the part, layer by layer -->
  <rect x="96" y="388" width="320" height="34" rx="17" fill="#2fb7a4"/>
  <rect x="112" y="346" width="288" height="34" rx="17" fill="#38c9b4"/>
  <rect x="128" y="304" width="256" height="34" rx="17" fill="#4fdcc6"/>
  <!-- the layer being laid -->
  <rect x="144" y="262" width="116" height="34" rx="17" fill="#ff9f43"/>
  <!-- the nozzle -->
  <path d="M212 96 h96 v56 l-24 64 h-48 l-24 -64 z" fill="#e8eef2"/>
  <rect x="196" y="76" width="128" height="34" rx="10" fill="#c5d1d9"/>
  <rect x="250" y="216" width="20" height="40" rx="8" fill="#ff9f43"/>
  <!-- the link -->
  <circle cx="392" cy="150" r="22" fill="none" stroke="#ff9f43" stroke-width="12"/>
  <circle cx="352" cy="200" r="22" fill="none" stroke="#ff9f43" stroke-width="12"/>
  <path d="M378 168 l-12 14" stroke="#ff9f43" stroke-width="12" stroke-linecap="round"/>
</svg>
